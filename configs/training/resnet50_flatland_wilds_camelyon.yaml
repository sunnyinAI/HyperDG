experiment_name: flatland_resnet50_wilds_camelyon
seed: 0
output_dir: experiments/flatland_wilds_camelyon
device: cuda
eval_on_start: false

dataset:
  config: configs/datasets/wilds_camelyon.yaml

algorithm: flatland

hparams:
  lr: 5.0e-5
  weight_decay: 0.0
  batch_size: 32
  grad_clip_norm: 5.0
  nonlinear_classifier: false
  n_steps: 5000
  checkpoint_freq: 1000
  alpha_curv: 0.2
  beta_align: 0.5
  gamma_sharp: 0.05
  curvature_lr: 1.0e-4
