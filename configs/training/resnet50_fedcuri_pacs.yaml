experiment_name: fedcuri_resnet50_pacs
seed: 0
output_dir: experiments/fedcuri_pacs
device: cuda

dataset:
  config: configs/datasets/pacs.yaml

algorithm: fedcuri

hparams:
  lr: 5.0e-5
  curvature_lr: 1.0e-4
  weight_decay: 0.0
  batch_size: 32
  grad_clip_norm: 5.0
  nonlinear_classifier: false
  n_steps: 5000
  checkpoint_freq: 200
  alpha_curv: 0.2
  beta_align: 0.5
  gamma_sharp: 0.05
  delta_local_flat: 0.1
  delta_global_flat: 0.1
  curvature_epsilon: 1.0e-4
