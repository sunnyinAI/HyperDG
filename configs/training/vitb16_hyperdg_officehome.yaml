experiment_name: vitb16_hyperdg_officehome
seed: 0
output_dir: experiments/vitb16_hyperdg_officehome
device: cuda
dataset:
  config: configs/datasets/officehome.yaml
algorithm: hyperdg
hparams:
  backbone: vitb16
  lr: 5.0e-05
  curvature_lr: 0.0001
  weight_decay: 0.0
  batch_size: 16
  grad_clip_norm: 5.0
  nonlinear_classifier: false
  n_steps: 5000
  checkpoint_freq: 200
  alpha_curv: 0.2
  beta_align: 0.5
  gamma_sharp: 0.05
  delta_local_flat: 0.1
  delta_global_flat: 0.1
  curvature_epsilon: 0.0001
  vit_model_name: vit_base_patch16_224
  vit_prompt_length: 10
  vit_prompt_dropout: 0.1
  vit_freeze_backbone: true
