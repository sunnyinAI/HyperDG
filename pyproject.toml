[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sftdg"
version = "0.1.0"
description = "Self-Feedback Training for Domain Generalization"
authors = [{ name = "Sunny Lab", email = "sunny@example.com" }]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
