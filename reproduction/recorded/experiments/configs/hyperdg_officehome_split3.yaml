algorithm: fedcuri
dataset:
  config: configs/datasets/officehome.yaml
  test_envs:
  - 3
device: cuda
experiment_name: fedcuri_resnet50_officehome_split3
hparams:
  alpha_curv: 0.2
  batch_size: 32
  beta_align: 0.5
  checkpoint_freq: 200
  curvature_epsilon: 0.0001
  curvature_lr: 0.0001
  delta_global_flat: 0.1
  delta_local_flat: 0.1
  gamma_sharp: 0.05
  grad_clip_norm: 5.0
  lr: 5.0e-05
  n_steps: 5000
  nonlinear_classifier: false
  weight_decay: 0.0
output_dir: experiments/fedcuri_officehome/split3
seed: 3
